services:
  postgres:
    image: postgres:16-alpine
    container_name: prospecta-brasil-pg
    environment:
      POSTGRES_USER: prospecta
      POSTGRES_PASSWORD: prospecta
      POSTGRES_DB: prospecta_brasil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospecta -d prospecta_brasil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
